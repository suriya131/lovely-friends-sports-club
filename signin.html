<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Lovely Friends Sports Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonYellow: '#ffea00',
                        neonGreen: '#39ff14',
                        charcoal: '#121212',
                        cardBlack: '#1e1e1e'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-charcoal text-white min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <div class="glass-card w-full max-w-md rounded-2xl p-5 sm:p-8 border border-neonGreen/40 shadow-[0_0_35px_rgba(57,255,20,0.2)] z-10 fade-in">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4 group">
                <img src="logo.png" alt="NSP Sports Club Logo" class="w-20 h-20 rounded-full mx-auto object-cover border-2 border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.5)] group-hover:scale-105 transition-transform">
            </a>
            <h1 class="font-bebas text-3xl sm:text-4xl md:text-5xl tracking-wider text-white">LOVELY FRIENDS <span class="text-neonYellow">SPORTS CLUB</span></h1>
            <p class="font-inter text-neonGreen text-xs uppercase tracking-widest font-semibold mt-1">Club Member &amp; Admin Portal</p>
        </div>

        <div id="signin-error" class="hidden mb-6 p-3 rounded-lg bg-red-950/80 border border-red-500/50 text-red-300 text-xs font-inter text-center"></div>

        <form id="page-signin-form" class="space-y-4" onsubmit="handleSignIn(event)" autocomplete="off">
            <!-- Invisible decoy fields to absorb aggressive browser credential autofill -->
            <input type="text" name="fake_username_remembered" tabindex="-1" aria-hidden="true" autocomplete="off" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">
            <input type="password" name="fake_password_remembered" tabindex="-1" aria-hidden="true" autocomplete="new-password" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;">

            <!-- Box 1: Phone No or Email (Starts completely empty) -->
            <div>
                <label for="page-identifier" class="block font-inter text-xs text-gray-300 mb-1.5 uppercase tracking-wider font-semibold">Phone No or Email:</label>
                <input type="text" id="page-identifier" name="nsp_club_login_id" value="" placeholder="Enter phone no or email" required autocomplete="off" readonly onfocus="this.removeAttribute('readonly')"
                    class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-neonGreen transition font-inter">
            </div>

            <!-- Box 2: Password (Starts completely empty) -->
            <div>
                <label for="page-password" class="block font-inter text-xs text-gray-300 mb-1.5 uppercase tracking-wider font-semibold">Password:</label>
                <div class="relative">
                    <input type="password" id="page-password" name="nsp_club_login_key" value="" placeholder="Enter password" required autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"
                        class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-4 py-3 pr-12 focus:outline-none focus:border-neonGreen transition font-inter">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white focus:outline-none cursor-pointer">
                        <svg id="page-eye-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="page-eye-slash-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Box 3: Admin Password -->
            <div>
                <label for="page-admin-password" class="block font-inter text-xs text-neonYellow mb-1.5 uppercase tracking-wider font-semibold">Admin Password:</label>
                <div class="relative">
                    <input type="password" id="page-admin-password" name="nsp_club_admin_key" value="" placeholder="Enter admin password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"
                        class="w-full bg-gray-900 border border-yellow-500/50 text-white text-sm rounded-lg px-4 py-3 pr-12 focus:outline-none focus:border-neonYellow transition font-inter">
                    <button type="button" onclick="toggleAdminPasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white focus:outline-none cursor-pointer">
                        <svg id="admin-eye-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="admin-eye-slash-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-neonGreen text-charcoal font-bebas text-2xl py-3 rounded-lg hover:bg-green-400 transition transform hover:scale-[1.02] shadow-[0_0_15px_#39ff14] mt-2 cursor-pointer font-bold">
                WELCOME TO LFC
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-800 text-center">
            <p class="font-inter text-xs text-gray-500">&copy; 2026 Lovely Friends Sports Club - Namasivayapuram</p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Force all input boxes to remain completely empty on load
        function forceEmptyInputs() {
            const idInput = document.getElementById('page-identifier');
            const passInput = document.getElementById('page-password');
            const adminInput = document.getElementById('page-admin-password');
            if (idInput && idInput.value !== '') {
                idInput.value = '';
            }
            if (passInput && passInput.value !== '') {
                passInput.value = '';
            }
            if (adminInput && adminInput.value !== '') {
                adminInput.value = '';
            }
        }

        // Clear immediately and at timed intervals to defeat browser auto-filling
        forceEmptyInputs();
        [20, 50, 100, 200, 300, 500, 800, 1200].forEach(delay => {
            setTimeout(forceEmptyInputs, delay);
        });

        // Allow user to click and type smoothly after load
        window.addEventListener('load', () => {
            forceEmptyInputs();
            setTimeout(() => {
                const idInput = document.getElementById('page-identifier');
                const passInput = document.getElementById('page-password');
                const adminInput = document.getElementById('page-admin-password');
                if (idInput) idInput.removeAttribute('readonly');
                if (passInput) passInput.removeAttribute('readonly');
                if (adminInput) adminInput.removeAttribute('readonly');
            }, 350);
        });

        window.addEventListener('pageshow', () => {
            forceEmptyInputs();
        });

        function togglePasswordVisibility() {
            const passInput = document.getElementById('page-password');
            const eye = document.getElementById('page-eye-icon');
            const eyeSlash = document.getElementById('page-eye-slash-icon');
            if (!passInput) return;
            if (passInput.type === 'password') {
                passInput.type = 'text';
                if (eye) eye.classList.remove('hidden');
                if (eyeSlash) eyeSlash.classList.add('hidden');
            } else {
                passInput.type = 'password';
                if (eye) eye.classList.add('hidden');
                if (eyeSlash) eyeSlash.classList.remove('hidden');
            }
        }

        function toggleAdminPasswordVisibility() {
            const passInput = document.getElementById('page-admin-password');
            const eye = document.getElementById('admin-eye-icon');
            const eyeSlash = document.getElementById('admin-eye-slash-icon');
            if (!passInput) return;
            if (passInput.type === 'password') {
                passInput.type = 'text';
                if (eye) eye.classList.remove('hidden');
                if (eyeSlash) eyeSlash.classList.add('hidden');
            } else {
                passInput.type = 'password';
                if (eye) eye.classList.add('hidden');
                if (eyeSlash) eyeSlash.classList.remove('hidden');
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const identifier = (document.getElementById('page-identifier') ? document.getElementById('page-identifier').value : '').trim();
            const password = (document.getElementById('page-password') ? document.getElementById('page-password').value : '').trim();
            const adminCode = (document.getElementById('page-admin-password') ? document.getElementById('page-admin-password').value : '').trim();
            const errEl = document.getElementById('signin-error');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (!identifier) {
                if (errEl) {
                    errEl.innerText = 'Please enter your phone number or email.';
                    errEl.classList.remove('hidden');
                }
                return;
            }

            // Strict Admin Validation: If admin password is entered, it MUST be NSPLFC
            if (adminCode && adminCode !== 'NSPLFC') {
                if (errEl) {
                    errEl.innerText = 'Incorrect Admin Password!';
                    errEl.classList.remove('hidden');
                }
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'CHECKING...';

            const result = await Auth.login(identifier, password, adminCode);
            submitBtn.disabled = false;
            submitBtn.innerText = 'WELCOME TO LFC';

            if (!result.success) {
                if (errEl) {
                    errEl.innerText = result.message;
                    errEl.classList.remove('hidden');
                }
            } else {
                if (errEl) errEl.classList.add('hidden');
                window.location.replace('index.html');
            }
        }

        // Fresh signin enabled
    </script>
</body>
</html>
