<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players List - Lovely Friends Sports Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonYellow: '#ffea00',
                        neonGreen: '#39ff14',
                        charcoal: '#121212',
                        cardBlack: '#1e1e1e'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        if (!localStorage.getItem('lfc_auth_user')) {
            window.location.replace('signin.html');
        }
    </script>
</head>
<!-- Supabase JS Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="bg-charcoal text-white min-h-screen flex flex-col">
        <!-- Navigation -->
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center relative">
        <a href="index.html" class="flex items-center gap-3 group">
            <img src="logo.png" alt="NSP Sports Club Logo" class="w-10 h-10 rounded-full object-cover border border-cyan-400/60 shadow-[0_0_10px_rgba(6,182,212,0.4)] group-hover:scale-105 transition-transform">
            <h1 class="text-2xl font-bebas tracking-wide text-white group-hover:text-neonYellow transition-colors">LOVELY FRIENDS</h1>
        </a>

        <!-- Right Side: Role Badge + Menu Button (Laptop & Mobile) -->
        <div class="flex items-center gap-3">
            <span id="nav-auth-badge" class="flex items-center"></span>
            <button id="mobile-menu-btn" onclick="toggleNavMenu(event)" class="flex items-center gap-2 bg-gray-900 border border-gray-700 hover:border-neonYellow text-white hover:text-neonYellow px-3.5 py-1.5 rounded-lg transition font-inter text-sm font-semibold shadow-md focus:outline-none cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span>MENU</span>
            </button>
        </div>
        
                <!-- Dropdown Menu (Laptop & Mobile) -->
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full md:w-80 md:left-auto md:right-6 bg-charcoal/95 backdrop-blur-xl border border-gray-800 flex-col font-inter font-semibold text-sm shadow-2xl z-50 md:rounded-2xl md:mt-2 overflow-hidden">
            <!-- Profile Status Header -->
            <div class="px-6 py-4 border-b border-gray-800/80 bg-gray-950/60 flex items-center justify-between">
                <span id="menu-role-status" class="font-bebas text-xl tracking-wider text-cyan-400 flex items-center gap-2">
                    <span id="menu-role-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
                    <span id="menu-role-name">MEMBER</span>
                </span>
                <span id="menu-user-id" class="font-inter text-xs text-gray-400 font-normal"></span>
            </div>

            <!-- Navigation Links -->
            <div class="flex flex-col">
                <a href="index.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>HOME</span>
                </a>
                <a href="live-score.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>LIVE MATCH SCORE</span>
                </a>
                <a href="players-list.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>PLAYERS LIST</span>
                </a>
                <a href="stats.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>MATCH STATS</span>
                </a>
                <a href="gallery.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>GALLERY</span>
                </a>
                <a href="squad.html" class="px-6 py-3.5 border-b border-gray-800/50 flex justify-between items-center transition text-white hover:text-neonYellow hover:bg-gray-800/40">
                    <span>SQUAD & INFO</span>
                </a>
            </div>

            <!-- Sign Out Button Footer -->
            <div class="p-4 border-t border-gray-800/80 bg-gray-950/60 flex justify-center">
                <button type="button" onclick="Auth.logout()" class="w-full text-center border border-red-500/80 text-red-400 hover:bg-red-500/20 hover:text-red-300 font-bebas text-lg tracking-wider px-4 py-2 rounded-lg transition cursor-pointer">
                    SIGN OUT
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center px-4 py-12 fade-in">
        <h2 class="font-bebas text-5xl md:text-6xl tracking-wider mb-2 text-center">
            TEAM <span class="text-neonGreen">PLAYERS</span>
        </h2>
        <p class="font-inter text-gray-400 mb-4 text-center max-w-lg">Complete list of our players.</p>
        <div id="db-status"
            class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold mb-8 bg-gray-800 text-gray-400 border border-gray-700">
            <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> Connecting to database...
        </div>

        <div
            class="w-full max-w-4xl glass-card rounded-xl overflow-hidden shadow-[0_0_15px_#39ff14] border border-neonGreen/30">
            <div class="overflow-x-auto">
                <table class="w-full text-left font-inter border-collapse">
                    <thead>
                        <tr
                            class="bg-cardBlack text-neonYellow font-bebas text-xl uppercase tracking-wider border-b-2 border-neonGreen/50">
                            <th class="px-6 py-4 border-r border-gray-700 w-2/5">Name</th>
                            <th class="px-6 py-4 border-r border-gray-700 w-1/4 text-center">Position</th>
                            <th class="px-6 py-4 border-r border-gray-700 w-1/4 text-center">Jersey No</th>
                            <th class="px-6 py-4 w-1/10 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="players-table-body" class="text-gray-300">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add New Player Form -->
        <div class="w-full max-w-4xl glass-card rounded-xl p-8 shadow-lg border border-gray-800 mt-8 mb-8">
            <h3 class="font-bebas text-3xl text-neonYellow mb-6">ADD NEW PLAYER</h3>
            <form id="add-player-form" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
                <div class="flex flex-col">
                    <label for="new-name" class="font-inter text-xs text-gray-400 mb-1 uppercase">Name</label>
                    <input type="text" id="new-name" required placeholder="Player Name"
                        class="bg-gray-900 border border-gray-700 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-neonGreen transition">
                </div>
                <div class="flex flex-col">
                    <label for="new-position" class="font-inter text-xs text-gray-400 mb-1 uppercase">Position</label>
                    <input type="text" id="new-position" required placeholder="e.g. All-Rounder"
                        class="bg-gray-900 border border-gray-700 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-neonGreen transition">
                </div>
                <div class="flex flex-col">
                    <label for="new-jersey" class="font-inter text-xs text-gray-400 mb-1 uppercase">Jersey No</label>
                    <input type="text" id="new-jersey" required placeholder="e.g. 07"
                        class="bg-gray-900 border border-gray-700 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-neonGreen transition">
                </div>
                <div class="flex flex-col">
                    <label for="admin-password" class="font-inter text-xs text-neonYellow mb-1 uppercase font-semibold">Admin Password</label>
                    <input type="password" id="admin-password" autocomplete="new-password" required placeholder="Enter password"
                        class="bg-gray-900 border border-yellow-500/50 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-neonYellow transition">
                </div>
                <button type="submit"
                    class="bg-neonGreen text-charcoal font-bebas text-xl py-2 rounded hover:bg-green-400 transition w-full shadow-[0_0_10px_#39ff14]">ADD</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 text-center text-gray-500 font-inter text-xs mt-auto">
        <p>&copy; 2026 Lovely Friends Sports Club - Namasivayapuram. All rights reserved.</p>
    </footer>
    <!-- Supabase CDN & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        // Club Admin Password
        const ADMIN_PASSWORD = 'NSPLFC';

        // Optional Supabase Configuration (Leave blank to use local SQLite database)
        const SUPABASE_URL = (typeof SUPABASE_CONFIG !== 'undefined' && SUPABASE_CONFIG.url) ? SUPABASE_CONFIG.url : '';
        const SUPABASE_ANON_KEY = (typeof SUPABASE_CONFIG !== 'undefined' && SUPABASE_CONFIG.anonKey) ? SUPABASE_CONFIG.anonKey : '';

        const hasSupabase = SUPABASE_URL && !SUPABASE_URL.includes('YOUR_PROJECT_ID') && window.supabase;
        const supabaseClient = hasSupabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let players = [];

        function updateDbStatus(isOnline, dbName) {
            const statusEl = document.getElementById('db-status');
            if (!statusEl) return;
            if (isOnline) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-neonGreen"></span> Connected to ${dbName}`;
                statusEl.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold mb-8 bg-green-950/60 text-neonGreen border border-neonGreen/40';
            } else {
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-yellow-400"></span> Local Offline Mode';
                statusEl.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold mb-8 bg-yellow-950/40 text-yellow-400 border border-yellow-500/40';
            }
        }

        // 1. FETCH & DISPLAY PLAYERS
        async function loadPlayers() {
            const tbody = document.getElementById('players-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Loading players...</td></tr>';

            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient
                        .from('players')
                        .select('*')
                        .order('id', { ascending: true });
                    if (error) throw error;
                    players = data || [];
                    updateDbStatus(true, 'Supabase Cloud Database');
                } else {
                    players = await API.getPlayers();
                    updateDbStatus(API.isLocalServer, 'SQLite Database');
                }
            } catch (err) {
                console.error('Error fetching players:', err);
                updateDbStatus(false);
            }

            renderTable(players);
        }

        // 2. RENDER TABLE
        function renderTable(list) {
            const tbody = document.getElementById('players-table-body');
            tbody.innerHTML = '';

            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">No players found in database. Add one below!</td></tr>';
                return;
            }

            list.forEach((p, index) => {
                const bgClass = index % 2 === 1 ? ' bg-black bg-opacity-30' : '';
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800 transition duration-200' + bgClass;
                const idVal = p.id !== undefined ? p.id : index;
                tr.innerHTML =
                    `<td class="px-6 py-4 border-b border-r border-gray-800 font-semibold text-white">${p.name}</td>` +
                    `<td class="px-6 py-4 border-b border-r border-gray-800 text-center">${p.position}</td>` +
                    `<td class="px-6 py-4 border-b border-r border-gray-800 text-center text-neonYellow font-bebas text-2xl">${p.jersey}</td>` +
                    `<td class="px-6 py-4 border-b border-gray-800 text-center">` +
                    `<button onclick="deletePlayer(${JSON.stringify(idVal)})" class="px-2.5 py-1 text-xs uppercase font-semibold font-inter text-red-400 hover:text-white border border-red-500/60 hover:border-red-400 hover:bg-red-500/20 rounded transition shadow-sm inline-flex items-center gap-1 cursor-pointer" title="Delete Player">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>DELETE</span>
                    </button>` +
                    `</td>`;
                tbody.appendChild(tr);
            });
        }

        // 3. ADD NEW PLAYER (Requires Admin or Password)
        document.getElementById('add-player-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Verify Admin Login or Password
            const enteredPass = document.getElementById('admin-password').value.trim();
            const isAdmin = typeof Auth !== 'undefined' && Auth.isAdmin();

            if (!isAdmin && enteredPass !== ADMIN_PASSWORD) {
                const wantsLogin = confirm('🔒 Admin access required. Would you like to Sign In with Email/Phone?');
                if (wantsLogin && typeof Auth !== 'undefined') {
                    Auth.open();
                }
                return;
            }

            const name = document.getElementById('new-name').value.trim();
            const position = document.getElementById('new-position').value.trim();
            const jersey = document.getElementById('new-jersey').value.trim();

            if (!name || !position || !jersey) return;

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = 'ADDING...';

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('players')
                        .insert([{ name, position, jersey }]);
                    if (error) throw error;
                } else {
                    await API.addPlayer({ name, position, jersey });
                }

                alert('✅ Player added successfully!');
                this.reset();
                if (isAdmin) document.getElementById('admin-password').value = ADMIN_PASSWORD;
                await loadPlayers();
            } catch (err) {
                alert('Error adding player: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ADD';
            }
        });

        // 4. DELETE PLAYER (Requires Admin or Password)
        window.deletePlayer = async function (id) {
            const isAdmin = typeof Auth !== 'undefined' && Auth.isAdmin();

            if (!isAdmin) {
                const enteredPass = prompt('Enter admin password to delete this player (or Sign In from top corner):');
                if (enteredPass === null) return; // User clicked Cancel

                if (enteredPass !== ADMIN_PASSWORD) {
                    alert('❌ Incorrect Password! Delete action cancelled.');
                    return;
                }
            }

            if (!confirm('Are you sure you want to permanently delete this player?')) return;

            try {
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('players')
                        .delete()
                        .eq('id', id);
                    if (error) throw error;
                } else {
                    await API.deletePlayer(id);
                }
                alert('Player deleted successfully.');
                await loadPlayers();
            } catch (err) {
                alert('Error deleting player: ' + err.message);
            }
        };

        // Initialize on load
        loadPlayers();
    </script>

    

</body>

</html>
